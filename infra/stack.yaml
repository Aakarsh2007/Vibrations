AWSTemplateFormatVersion: "2010-09-09"
Description: >
  VibraLens (OpenCV AI Competition 2026). Zero-budget layout for an AWS Free Plan account:
  one S3 bucket, one DynamoDB table (on-demand), one SNS topic, an EC2 instance role, a log group,
  a CloudFront distribution in front of the EC2 instance (HTTPS without buying a domain/certificate).
  The EC2 instance itself is launched separately (see infra/deploy.md) so it can be stopped/started freely.

Parameters:
  AlertEmail:
    Type: String
    Description: Supervisor e-mail that receives work-order approval requests (confirm the SNS subscription mail).
  Ec2PublicDns:
    Type: String
    Default: ""
    Description: Public DNS of the EC2 instance (leave empty on the first deploy; update the stack afterwards).
  OriginSecret:
    Type: String
    NoEcho: true
    MinLength: 24
    Description: Random string CloudFront sends to the origin; the app rejects requests without it.

Conditions:
  HasOrigin: !Not [!Equals [!Ref Ec2PublicDns, ""]]

Resources:
  Bucket:
    Type: AWS::S3::Bucket
    Properties:
      PublicAccessBlockConfiguration:
        BlockPublicAcls: true
        BlockPublicPolicy: true
        IgnorePublicAcls: true
        RestrictPublicBuckets: true
      BucketEncryption:
        ServerSideEncryptionConfiguration:
          - ServerSideEncryptionByDefault: { SSEAlgorithm: AES256 }
      LifecycleConfiguration:
        Rules:
          - { Id: raw-7d, Status: Enabled, Prefix: raw/, ExpirationInDays: 7 }
          - { Id: results-30d, Status: Enabled, Prefix: results/, ExpirationInDays: 30 }
      CorsConfiguration:
        CorsRules:
          - AllowedMethods: [POST, GET]
            AllowedOrigins: ["*"]          # uploads are authorised by short-lived presigned POST policies
            AllowedHeaders: ["*"]
            MaxAge: 3000

  Items:
    Type: AWS::DynamoDB::Table
    Properties:
      TableName: vl_items
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions: [{ AttributeName: pk, AttributeType: S }]
      KeySchema: [{ AttributeName: pk, KeyType: HASH }]
      TimeToLiveSpecification: { AttributeName: expires_at_ttl, Enabled: true }

  Topic:
    Type: AWS::SNS::Topic
    Properties:
      TopicName: vibralens-approvals
      Subscription: [{ Protocol: email, Endpoint: !Ref AlertEmail }]

  Logs:
    Type: AWS::Logs::LogGroup
    Properties: { LogGroupName: /vibralens/app, RetentionInDays: 14 }

  Role:
    Type: AWS::IAM::Role
    Properties:
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement: [{ Effect: Allow, Principal: { Service: ec2.amazonaws.com }, Action: sts:AssumeRole }]
      ManagedPolicyArns: [arn:aws:iam::aws:policy/AmazonSSMManagedInstanceCore]   # shell via SSM, no open SSH needed
      Policies:
        - PolicyName: vibralens-least-privilege
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              - Effect: Allow
                Action: [s3:GetObject, s3:PutObject, s3:DeleteObject]
                Resource: [!Sub "${Bucket.Arn}/raw/*", !Sub "${Bucket.Arn}/results/*", !Sub "${Bucket.Arn}/traces/*"]
              - Effect: Allow
                Action: [dynamodb:GetItem, dynamodb:PutItem, dynamodb:UpdateItem, dynamodb:DeleteItem, dynamodb:Scan, dynamodb:Query]
                Resource: !GetAtt Items.Arn
              - Effect: Allow
                Action: [sns:Publish]
                Resource: !Ref Topic
              - Effect: Allow
                Action: [bedrock:InvokeModel, bedrock:Converse]
                Resource: ["arn:aws:bedrock:*::foundation-model/amazon.nova-*", !Sub "arn:aws:bedrock:*:${AWS::AccountId}:inference-profile/*"]
              - Effect: Allow
                Action: [logs:CreateLogStream, logs:PutLogEvents]
                Resource: !Sub "${Logs.Arn}:*"
              - Effect: Allow
                Action: [cloudwatch:PutMetricData]
                Resource: "*"
                Condition: { StringEquals: { cloudwatch:namespace: VibraLens } }

  InstanceProfile:
    Type: AWS::IAM::InstanceProfile
    Properties: { Roles: [!Ref Role] }

  Cdn:
    Type: AWS::CloudFront::Distribution
    Condition: HasOrigin
    Properties:
      DistributionConfig:
        Enabled: true
        PriceClass: PriceClass_200
        Origins:
          - Id: ec2
            DomainName: !Ref Ec2PublicDns
            CustomOriginConfig: { HTTPPort: 8000, OriginProtocolPolicy: http-only }
            OriginCustomHeaders: [{ HeaderName: X-Origin-Secret, HeaderValue: !Ref OriginSecret }]
        DefaultCacheBehavior:
          TargetOriginId: ec2
          ViewerProtocolPolicy: redirect-to-https
          AllowedMethods: [GET, HEAD, OPTIONS, PUT, POST, PATCH, DELETE]
          CachePolicyId: 4135ea2d-6df8-44a3-9df3-4b5a84be39ad          # Managed-CachingDisabled
          OriginRequestPolicyId: b689b0a8-53d0-40ab-baf2-68738e2966ac  # Managed-AllViewerExceptHostHeader

  HealthAlarm:
    Type: AWS::CloudWatch::Alarm
    Properties:
      AlarmDescription: Job failures in VibraLens
      Namespace: VibraLens
      MetricName: JobFailures
      Statistic: Sum
      Period: 900
      EvaluationPeriods: 1
      Threshold: 3
      ComparisonOperator: GreaterThanOrEqualToThreshold
      TreatMissingData: notBreaching
      AlarmActions: [!Ref Topic]

Outputs:
  BucketName: { Value: !Ref Bucket }
  TopicArn: { Value: !Ref Topic }
  InstanceProfileName: { Value: !Ref InstanceProfile }
  CdnDomain: { Condition: HasOrigin, Value: !GetAtt Cdn.DomainName }
